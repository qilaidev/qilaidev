<rect x="100.7" y="102.0" width="82.4" height="18" rx="5" fill="#58a6ff" fill-opacity="0.14" stroke="#58a6ff" stroke-opacity="0.4"/><text x="107.7" y="114.5" class="tag" fill="#58a6ff">Memory Layer</text>
<rect x="189.1" y="102.0" width="82.4" height="18" rx="5" fill="#58a6ff" fill-opacity="0.14" stroke="#58a6ff" stroke-opacity="0.4"/><text x="196.1" y="114.5" class="tag" fill="#58a6ff">Git Worktree</text>
